name: Containment CI

on:
  pull_request:
  push:
    branches:
      - master
      - security/retire-legacy-crm

permissions:
  contents: read

jobs:
  verify:
    name: Static boundary (Node 22.23.1)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install exact Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.1"
          package-manager-cache: false
      - name: Install the empty locked dependency graph
        run: npm ci --ignore-scripts
      - name: Verify build, tests, and dependency audit
        run: npm run check
      - name: Enforce read-only verification
        run: |
          git diff --check
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
